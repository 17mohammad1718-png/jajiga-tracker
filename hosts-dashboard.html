<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد میزبان‌های بابلکنار</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --card: #1b1f2a;
  --card2: #232936;
  --border: #2e3545;
  --text: #e8eaf0;
  --muted: #9aa3b5;
  --accent: #10b981;
  --accent2: #3b82f6;
  --gold: #f59e0b;
  --red: #ef4444;
  --purple: #8b5cf6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
  padding: 20px;
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; }

/* header */
.hero {
  background: linear-gradient(135deg, #0d9488 0%, #0f766e 35%, #1d4ed8 100%);
  border-radius: 16px;
  padding: 22px 26px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.hero h1 { font-size: 1.6rem; font-weight: 800; color: #fff; margin: 0; text-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.hero .subtitle { color: rgba(255,255,255,0.85); font-size: 0.85rem; margin-top: 4px; }
.hero .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .badge-row span {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.78rem;
  color: #fff;
  font-weight: 600;
}

/* stats cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px; display: flex; align-items: center; gap: 14px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.stat:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
.stat .icon {
  width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex-shrink: 0;
}
.stat .num { font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
.stat .label { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
.stat.accent .icon { background: rgba(16,185,129,0.15); }
.stat.accent .num { color: var(--accent); }
.stat.gold .icon { background: rgba(245,158,11,0.15); }
.stat.gold .num { color: var(--gold); }
.stat.blue .icon { background: rgba(59,130,246,0.15); }
.stat.blue .num { color: var(--accent2); }
.stat.purple .icon { background: rgba(139,92,246,0.15); }
.stat.purple .num { color: var(--purple); }
.stat.cyan .icon { background: rgba(6,182,212,0.15); }
.stat.cyan .num { color: #06b6d4; }

/* chart */
.chart-row {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 20px; margin-bottom: 16px;
}
.chart-row .chart-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; color: var(--text); }
.chart-bars { display: flex; gap: 18px; align-items: flex-end; height: 130px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.chart-col .bar-v {
  width: 100%; max-width: 90px; border-radius: 8px 8px 0 0;
  min-height: 4px;
  transition: height 0.4s ease;
}
.chart-col .lbl { font-size: 0.72rem; color: var(--muted); }
.chart-col .val { font-size: 0.85rem; font-weight: 800; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
.toolbar input[type="text"] {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; min-width: 220px; font-family: inherit;
}
.toolbar select {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; font-family: inherit;
}
.toolbar .count { color: var(--muted); font-size: 0.8rem; margin-right: auto; }

/* table */
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
thead th {
  background: var(--card2); color: var(--muted); text-align: center; padding: 10px 12px;
  cursor: pointer; user-select: none; white-space: nowrap; font-size: 0.78rem;
  border-bottom: 2px solid var(--border);
}
thead th:hover { color: var(--text); }
thead th .arrow { font-size: 0.65rem; }
tbody tr { border-top: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
tbody tr:hover { background: rgba(59,130,246,0.08); }
tbody td { padding: 9px 12px; vertical-align: middle; text-align: center; }
td.num { text-align: center; font-variant-numeric: tabular-nums; }
td.host-name { text-align: right; }

/* English digit font */
.en { font-family: Consolas, 'Courier New', monospace; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.en-badge { font-family: Consolas, 'Courier New', monospace; }

/* rank number */
.rank { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 0.72rem; font-weight: 700; }
.rank.top1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1a1206; }
.rank.top2 { background: linear-gradient(135deg, #cbd5e1, #94a3b8); color: #1e293b; }
.rank.top3 { background: linear-gradient(135deg, #b45309, #92400e); color: #fef3c7; }
.rank.other { background: rgba(255,255,255,0.08); color: var(--muted); }

/* response-time colors */
.resp-fast { color: var(--accent); }
.resp-mid { color: var(--gold); }
.resp-slow { color: var(--red); }

/* accept rate bar */
.accept-wrap { display: flex; align-items: center; gap: 6px; }
.accept-bar { background: rgba(255,255,255,0.06); border-radius: 4px; height: 6px; width: 44px; overflow: hidden; }
.accept-fill { height: 100%; border-radius: 4px; }

/* member chip */
.chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; background: rgba(255,255,255,0.05); color: var(--muted); }
.chip.old { background: rgba(16,185,129,0.1); color: var(--accent); }
.chip.new { background: rgba(59,130,246,0.1); color: var(--accent2); }

/* badges */
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
.badge.pro { background: rgba(245,158,11,0.15); color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
.badge.active { background: rgba(16,185,129,0.15); color: var(--accent); border: 1px solid rgba(16,185,129,0.3); }
.badge.new { background: rgba(59,130,246,0.15); color: var(--accent2); border: 1px solid rgba(59,130,246,0.3); }
.badge.beginner { background: rgba(156,163,175,0.12); color: var(--muted); border: 1px solid rgba(156,163,175,0.25); }
.badge.verified { background: rgba(16,185,129,0.12); color: var(--accent); }
.badge.notverified { background: rgba(239,68,68,0.12); color: var(--red); }

/* expandable row */
.detail-row { display: none; background: rgba(0,0,0,0.25); }
.detail-row.open { display: table-row; }
.detail-cell { padding: 14px 16px !important; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.room-card { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.room-card .rt { font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
.room-card .rmeta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.72rem; color: var(--muted); }
.room-card .rmeta span { background: rgba(255,255,255,0.05); padding: 2px 7px; border-radius: 6px; }
.room-card a { color: var(--accent2); text-decoration: none; font-size: 0.72rem; }
.room-card a:hover { text-decoration: underline; }
.host-desc { color: var(--muted); font-size: 0.75rem; margin-top: 8px; max-width: 600px; line-height: 1.6; }

/* bars */
.bar-wrap { background: rgba(255,255,255,0.06); border-radius: 4px; height: 7px; width: 90px; overflow: hidden; }
.bar {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #3b82f6, #10b981);
}
.bar.gold { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.bar.green { background: linear-gradient(90deg, #10b981, #34d399); }
.bar.blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

/* level row tinting */
tr.level-pro { background: rgba(245,158,11,0.04) !important; }
tr.level-active { }
tr.level-new { }
tr.level-beginner { opacity: 0.82; }

.empty { text-align: center; color: var(--muted); padding: 30px; }
footer { text-align: center; color: var(--muted); font-size: 0.7rem; margin-top: 24px; }

/* floating nav buttons — modern glass, bottom-center, one at a time */
.nav-btns { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; }
.nav-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow:
    0 4px 24px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.08);
  transition:
    opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
    background 0.25s ease, color 0.25s ease,
    border-color 0.25s ease, box-shadow 0.25s ease,
    width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0;
  pointer-events: none;
  transform: translateY(24px) scale(0.8);
  width: 0; margin: 0;
}
.nav-btn svg { width: 20px; height: 20px; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); flex-shrink: 0; }
.nav-btn.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
  width: 46px; margin: 0 2px;
}
.nav-btn:hover {
  background: rgba(13, 148, 136, 0.9);
  color: #fff;
  border-color: rgba(255,255,255,0.25);
  box-shadow:
    0 8px 32px rgba(13, 148, 136, 0.35),
    inset 0 1px 0 rgba(255,255,255,0.2);
}
.nav-btn:hover svg { transform: translateY(-2px) scale(1.1); }
.nav-btn#btnTop:hover svg { transform: translateY(-3px); }
.nav-btn#btnBottom:hover svg { transform: translateY(3px); }
.nav-btn:active { transform: scale(0.94); }
</style>
</head>

</div>

<div class="nav-btns">

  </button>
</div>

const hosts = DATA.hosts;
let sortKey = null;   // null = پیش‌فرض (رزرو نزولی)
let sortDir = -1;

const en = n => (n ?? 0).toLocaleString('en-US');
const levelBadge = l => {
  const map = {'حرفه‌ای':'pro','فعال':'active','تازه‌کار':'new','مبتدی':'beginner'};
  return `<span class="badge ${map[l]||'beginner'}">${l}</span>`;
};
const clsBadge = c => {
  const map = {'اقتصادی':'beginner','استاندارد':'new','ممتاز':'active','لوکس':'pro'};
  return `<span class="badge ${map[c]||'beginner'}">${c}</span>`;
};
function respClass(min) {
  if (min == null) return '';
  if (min <= 60) return 'resp-fast';
  if (min <= 240) return 'resp-mid';
  return 'resp-slow';
}
function acceptColor(pct) {
  if (pct >= 95) return 'var(--accent)';
  if (pct >= 80) return 'var(--gold)';
  return 'var(--red)';
}
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + (365 * gy) + ~~((gy2 + 3) / 4) - ~~((gy2 + 99) / 100) + ~~((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
  let jy = -1595 + (33 * ~~(days / 12053));
  days %= 12053;
  jy += 4 * ~~(days / 1461);
  days %= 1461;
  if (days > 365) {
    jy += ~~((days - 1) / 365);
    days = (days - 1) % 365;
  }
  let jm, jd;
  if (days < 186) {
    jm = 1 + ~~(days / 31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + ~~((days - 186) / 30);
    jd = 1 + ((days - 186) % 30);
  }
  return [jy, jm, jd];
}
function jalaliLabel(since) {
  if (!since) return '—';
  const [gy, gm, gd] = since.split('-').map(Number);
  const [jy, jm] = gregorianToJalali(gy, gm, gd);
  return `از ${JALALI_MONTHS[jm - 1]} ${jy}`;
}
function memberChip(since) {
  if (!since) return '—';
  const jy = gregorianToJalali(...since.split('-').map(Number))[0];
  if (jy <= 1401) return `<span class="chip old">${jalaliLabel(since)}</span>`;
  if (jy >= 1404) return `<span class="chip new">${jalaliLabel(since)}</span>`;
  return `<span class="chip">${jalaliLabel(since)}</span>`;
}

function renderLevelChart(s) {
  const el = document.getElementById('levelChart');
  el.style.display = 'block';
  const counts = { 'حرفه‌ای': 0, 'فعال': 0, 'تازه‌کار': 0, 'مبتدی': 0 };
  hosts.forEach(h => { if (counts[h.host_level] !== undefined) counts[h.host_level]++; });
  const colors = { 'حرفه‌ای': 'linear-gradient(180deg,#fbbf24,#d97706)', 'فعال': 'linear-gradient(180deg,#34d399,#059669)', 'تازه‌کار': 'linear-gradient(180deg,#60a5fa,#2563eb)', 'مبتدی': 'linear-gradient(180deg,#94a3b8,#64748b)' };
  const max = Math.max(...Object.values(counts), 1);
  el.innerHTML = `<div class="chart-title">📊 توزیع سطح میزبان‌ها</div><div class="chart-bars">` +
    Object.entries(counts).map(([k, v]) => `
      <div class="chart-col">
        <div class="val en">${en(v)}</div>
        <div class="bar-v" style="height:${Math.round(v / max * 100)}px;background:${colors[k]}"></div>
        <div class="lbl">${k}</div>
      </div>`).join('') +
    `</div>`;
}

const LEVEL_ORDER = {'حرفه‌ای': 4, 'فعال': 3, 'تازه‌کار': 2, 'مبتدی': 1};

function sortValue(h, key) {
  if (key === 'rank' || key === 'total_success_books') return h.total_success_books ?? 0;
  if (key === 'host_level') return LEVEL_ORDER[h.host_level] || 0;
  if (key === 'member_since') return h.member_since ? parseInt(h.member_since.slice(0, 4)) || 0 : 0;
  if (key === 'name') return h.name || '';
  return h[key] ?? 0;
}

function getFiltered() {
  const q = document.getElementById('search').value.trim();
  const lv = document.getElementById('levelFilter').value;
  const mf = document.getElementById('multiFilter').value;
  let list = hosts.filter(h => {
    if (lv && h.host_level !== lv) return false;
    if (mf === 'multi' && h.rooms_count <= 1) return false;
    if (mf === 'single' && h.rooms_count > 1) return false;
    if (q && !h.name.includes(q)) return false;
    return true;
  });
  if (sortKey === null) {
    // بدون سورت: ترتیب پیش‌فرض رزرو نزولی
    list.sort((a, b) => (b.total_success_books ?? 0) - (a.total_success_books ?? 0));
    return list;
  }
  list.sort((a, b) => {
    const va = sortValue(a, sortKey), vb = sortValue(b, sortKey);
    if (typeof va === 'string') return va.localeCompare(vb, 'fa') * sortDir;
    if (va === vb) return (b.total_success_books ?? 0) - (a.total_success_books ?? 0); // tie-break
    return ((va ?? 0) - (vb ?? 0)) * sortDir;
  });
  return list;
}

function render() {
  const list = getFiltered();
  document.getElementById('count').textContent = `${en(list.length)} میزبان از ${en(hosts.length)}`;
  const tb = document.getElementById('tbody');
  if (!list.length) {
    tb.innerHTML = `<tr><td colspan="9"><div class="empty">میزبانی یافت نشد</div></td></tr>`;
    return;
  }
  const maxBooks = Math.max(...list.map(h => h.total_success_books), 1);
  tb.innerHTML = list.map((h, idx) => {
    const rank = idx + 1;
    const rankCls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : 'other';
    const levelCls = 'level-' + ({'حرفه‌ای':'pro','فعال':'active','تازه‌کار':'new','مبتدی':'beginner'}[h.host_level] || 'beginner');
    const pct = h.accept_rate != null ? h.accept_rate : null;
    const barPct = Math.round(h.total_success_books / maxBooks * 100);
    const barCls = h.total_success_books >= 200 ? 'gold' : h.total_success_books >= 50 ? 'green' : 'blue';
    const price = h.avg_price ? `<span class="en">${en(h.avg_price)}</span>` : '—';
    const respMin = h.response_time_min;
    const respTxt = respMin == null ? '—' : `<span class="en">${respMin < 60 ? en(respMin) : (respMin/60).toFixed(1)}</span>`;
    return `<tr class="${levelCls}" onclick="toggleDetail(${h.id})">
      <td><span class="rank ${rankCls} en">${rank}</span></td>
      <td class="host-name"><strong>${h.name}</strong>${h.description ? `<div style="font-size:0.68rem;color:var(--muted)">${h.description.slice(0,40)}</div>` : ''}</td>
      <td>${levelBadge(h.host_level)}</td>
      <td class="num"><span class="en">${en(h.rooms_count)}</span></td>
      <td class="num">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="en">${en(h.total_success_books)}</span>
          <div class="bar-wrap"><div class="bar ${barCls}" style="width:${barPct}%"></div></div>
        </div>
      </td>
      <td class="num">${price}</td>
      <td class="num">${pct != null ? `<div class="accept-wrap"><span class="en">${en(pct)}٪</span><div class="accept-bar"><div class="accept-fill" style="width:${pct}%;background:${acceptColor(pct)}"></div></div></div>` : '—'}</td>
      <td class="num ${respClass(respMin)}">${respTxt}</td>
      <td class="num">${memberChip(h.member_since)}</td>
    </tr>
    <tr class="detail-row" id="detail-${h.id}"><td colspan="9" class="detail-cell"><div class="detail-grid">${roomsHtml(h)}</div>${h.description ? `<div class="host-desc">📝 ${h.description}</div>` : ''}</td></tr>`;
  }).join('');
}

function roomsHtml(h) {
  if (!h.rooms.length) return '<div class="empty">اقامتگاهی ثبت نشده</div>';
  return h.rooms.map(r => {
    const g = Array.isArray(r.guests) ? (r.guests[0] + (r.guests[1] !== r.guests[0] ? '–' + r.guests[1] : '')) : '—';
    return `<div class="room-card">
      <div class="rt">${r.title || 'بدون عنوان'}</div>
      <div class="rmeta">
        <span>💰 <span class="en">${r.price ? en(r.price) : '—'}</span> ت</span>
        <span>${clsBadge(r.class)}</span>
        <span>⭐ <span class="en">${r.rating ?? '—'}</span> (<span class="en">${en(r.reviews ?? 0)}</span>)</span>
        <span>📅 <span class="en">${en(r.success_books ?? 0)}</span> رزرو</span>
        <span>🛏 <span class="en">${en(r.bedrooms ?? 0)}</span> خواب</span>
        <span>📐 <span class="en">${en(r.floor_area ?? 0)}</span> م²</span>
        <span>👥 <span class="en">${g}</span> نفر</span>
        ${r.is_plus ? '<span>⭐ پلاس</span>' : ''}
        ${r.is_instant ? '<span>⚡ فوری</span>' : ''}
      </div>
      <a href="${r.url}" target="_blank">مشاهده در جاجیگا ↗</a>
    </div>`;
  }).join('');
}

function toggleDetail(id) {
  const el = document.getElementById('detail-' + id);
  if (el) el.classList.toggle('open');
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (!key) return;
    if (sortKey === key) {
      // چرخه: زیاد→کم ▼ → کم→زیاد ▲ → بدون سورت
      if (sortDir === -1) { sortDir = 1; }
      else if (sortDir === 1) { sortKey = null; sortDir = -1; }
    } else {
      sortKey = key;
      // برای نام: الفبایی (کم→زیاد)؛ بقیه: زیاد→کم
      sortDir = key === 'name' ? 1 : -1;
    }
    document.querySelectorAll('thead th .arrow').forEach(a => a.textContent = '');
    if (sortKey !== null) th.querySelector('.arrow').textContent = sortDir === -1 ? '▼' : '▲';
    render();
  });
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('levelFilter').addEventListener('change', render);
document.getElementById('multiFilter').addEventListener('change', render);

renderStats();
render();

// smart scroll buttons — MATCH scroll direction, helpful, appear only while scrolling
const btnTop = document.getElementById('btnTop');
const btnBottom = document.getElementById('btnBottom');
let lastScrollY = window.scrollY;
let scrollTimer = null;
function updateNavBtns() {
  const y = window.scrollY;
  const max = document.body.scrollHeight - window.innerHeight;
  const goingDown = y > lastScrollY;       // در حال اسکرول به پایین
  const goingUp = y < lastScrollY;         // در حال اسکرول به بالا
  lastScrollY = y;

  if (goingDown) {
    // داریم پایین می‌رویم → دکمه ⬇️ پایین (همراه جهت، کمک می‌کند ادامه دهیم)
    btnBottom.classList.toggle('visible', max - y > 100);
    btnTop.classList.remove('visible');
  } else if (goingUp) {
    // داریم بالا می‌آییم → دکمه ⬆️ بالا (همراه جهت، کمک می‌کند ادامه دهیم)
    btnTop.classList.toggle('visible', y > 100);
    btnBottom.classList.remove('visible');
  }

  // بعد از توقف اسکرول (800ms) مخفی می‌شوند
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    btnTop.classList.remove('visible');
    btnBottom.classList.remove('visible');
  }, 800);
}
function scrollStep(dir) {
  // یک صفحه (viewport) در همان جهت حرکت می‌کنیم — کمک‌کننده
  window.scrollBy({ top: dir * window.innerHeight * 0.9, behavior: 'smooth' });
}
window.addEventListener('scroll', updateNavBtns, { passive: true });
window.addEventListener('resize', updateNavBtns);
updateNavBtns();
</script>
